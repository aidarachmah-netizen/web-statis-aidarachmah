<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Kotak</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 850px;
            height: 430px;
            margin: auto;
            border: 3px solid black;
            padding: 12px;
            display: grid;
            grid-template-columns: 3fr 1fr 3fr 1fr;
            grid-template-rows: 80px 80px 80px 70px 70px;
            gap: 6px;
        }

        .box {
            border: 2px solid #777;
            padding: 10px;
            font-size: 18px;
        }

        .box1 {
            grid-column: 1;
            grid-row: 1;
        }

        .box2 {
            grid-column: 2;
            grid-row: 1 / 4;
        }

        .box3 {
            grid-column: 3;
            grid-row: 1;
        }

        .box4 {
            grid-column: 1;
            grid-row: 2;
        }

        .box5 {
            grid-column: 1;
            grid-row: 2;
            margin-left: 105px;
            width: 105px;
        }

        .box6 {
            grid-column: 1;
            grid-row: 2;
            margin-left: 215px;
            width: 105px;
        }

        .box7 {
            grid-column: 3;
            grid-row: 2;
        }

        .box8 {
            grid-column: 3;
            grid-row: 2;
            margin-left: 105px;
            width: 105px;
        }

        .box9 {
            grid-column: 1;
            grid-row: 3;
        }

        .box10 {
            grid-column: 3;
            grid-row: 3;
        }

        .n1 {
            grid-column: 4;
            grid-row: 1 / 3;
        }

        .n2 {
            grid-column: 4;
            grid-row: 3;
        }

        .n3 {
            grid-column: 1 / 5;
            grid-row: 4;
        }

        .n4 {
            grid-column: 1;
            grid-row: 5;
        }

        .n5 {
            grid-column: 2;
            grid-row: 5;
        }

        .n6 {
            grid-column: 3;
            grid-row: 5;
        }

        .n7 {
            grid-column: 4;
            grid-row: 5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
        <div class="box box9">9</div>
        <div class="box box10">10</div>
        <div class="box n1">N</div>
        <div class="box n2">N</div>
        <div class="box n3">N</div>
        <div class="box n4">N</div>
        <div class="box n5">N</div>
        <div class="box n6">N</div>
        <div class="box n7">N</div>
    </div>
</body>

</html>
