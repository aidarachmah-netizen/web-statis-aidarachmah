<!doctype html>
<html lang="id">

<head>

    <title>Aida Studio</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background-color: #fff;
            color: #333;
            line-height: 1,9;
        }

        /* HEADER */
        header {
            display: grid;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            border-bottom: 1px solid #797878;
        }

        header h1 {
            font-size: 50px;
            font-weight: 6000;
        }

        nav a {
            text-decoration: none;
            color: #666;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }



        /* BUKU PILIHAN */
        .buku-pilihan h2 {
            font-size: 15px;
            margin-bottom: 15px;
            color: #666;
            
        }

        .buku-pilihan h3 {
            font-size:30px;
            margin-bottom: 15px;
        }


        .card {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
        }

        .card h4 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 14px;
            color: #3e3c3c;
            margin-bottom: 12px;
            font-style: unset;
        }

        .buku-pilihan {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }




    </style>
</head>
